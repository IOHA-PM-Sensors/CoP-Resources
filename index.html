<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IOHA PM Sensors Resources</title>
  <style>
    :root {
      --bg: #f7f9fc;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #53627a;
      --line: #dfe7f2;
      --link: #0b57d0;
      --accent: #eaf2ff;
    }

    body {
      margin: 0;
      padding: 40px 20px;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
      line-height: 1.6;
    }

    .container {
      max-width: 980px;
      margin: 0 auto;
    }

    .logo {
      display: block;
      width: auto;
      height: auto;
      max-width: 180px;
      max-height: 100px;
      margin-bottom: 20px;
    }

    h1 {
      margin-bottom: 8px;
      font-size: 2rem;
    }

    .subtitle {
      margin-top: 0;
      color: var(--muted);
      font-size: 1.05rem;
    }

    .grid {
      display: grid;
      gap: 18px;
      margin-top: 24px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 20px 22px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
    }

    .card h2 {
      margin: 0 0 8px;
      font-size: 1.2rem;
    }

    .meta {
      color: var(--muted);
      margin-bottom: 12px;
      font-size: 0.96rem;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .actions a {
      display: inline-block;
      padding: 8px 12px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      border: 1px solid var(--line);
      background: var(--accent);
      color: var(--link);
    }

    .actions a:hover {
      text-decoration: none;
      background: #dfeeff;
    }

    .discussion {
      margin-top: 12px;
      font-size: 0.95rem;
    }

    .discussion a {
      color: var(--link);
      text-decoration: none;
    }

    .discussion a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <img class="logo" src="https://raw.githubusercontent.com/IOHA-PM-Sensors/CoP-Resources/f8790b96a8d1df7e5fd39e01481dc6902cd51f31/IOHA.jpg" alt="IOHA logo" />
    <h1>IOHA PM Sensors Resources</h1>
    <p class="subtitle">Community of Practice on PM Sensor Technologies</p>

    <div class="grid">
      <div class="card">
        <h2>IOHA PM Sensors Playbook</h2>
        <div class="meta">Play#1</div>

        <div class="actions">
          <a href="Play1-revised.pdf" target="_blank" rel="noopener">View</a>
          <a href="Play1-revised.pdf" download>Download</a>
        </div>

        <div class="discussion">
          <a href="https://github.com/IOHA-PM-Sensors/CoP-Resources/discussions/2">
            Discuss Play#1 — in-field coaching
          </a>
        </div>
      </div>

      <!-- Add more documents like this -->
      <!--
      <div class="card">
        <h2>Another Document</h2>
        <div class="meta">Play#2</div>

        <div class="actions">
          <a href="AnotherFile.pdf" target="_blank" rel="noopener">View</a>
          <a href="AnotherFile.pdf" download>Download</a>
        </div>

        <div class="discussion">
          <a href="https://github.com/IOHA-PM-Sensors/CoP-Resources/discussions/YourDiscussionNumber">
            Discuss Play#2
          </a>
        </div>
      </div>
      -->
    </div>
  </div>
</body>
</html>
